# Compila o Nanquim (Krita + nossos patches) para Android arm64 e publica o APK.
# Baseado no script oficial do Krita: krita/build-tools/ci-scripts/android.yml
name: Android arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "KRITA_REF"
      - ".github/workflows/android.yml"

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      NDK_VERSION: "27.3.13750724"
      KDECI_ANDROID_ABI: arm64-v8a
      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
      KDECI_SKIP_ECM_ANDROID_TOOLCHAIN: "True"
      KDECI_EXTRA_CMAKE_ARGS: "-DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF"
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-android-arm64-v8a
      KDECI_WORKDIR_PATH: /mnt/wd
      KDECI_CACHE_PATH: /mnt/cache/artifacts/
      KDECI_CC_CACHE: /mnt/cache/ccache/
      KRITACI_ANDROID_PACKAGE_TYPE: nightly
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: "True"
      KRITACI_ARCHIVE_ARTIFACTS: "False"
      KRITACI_SKIP_COMMON_ARTIFACTS: "False"
      CI_PROJECT_NAME: krita
      CI_COMMIT_REF_NAME: master
      CI_PROJECT_DIR: ${{ github.workspace }}/krita

    steps:
      - name: Liberar espaço em disco (mantém o Android SDK)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Preparar pastas de trabalho em /mnt
        shell: bash
        run: |
          sudo mkdir -p /mnt/wd /mnt/cache/artifacts /mnt/cache/ccache
          sudo chown -R "$USER" /mnt/wd /mnt/cache
          df -h / /mnt

      - name: Baixar o repositório Nanquim
        uses: actions/checkout@v4
        with:
          path: nanquim

      - name: Baixar o Krita e aplicar os patches do Nanquim
        shell: bash
        run: |
          REF=$(tr -d '[:space:]' < nanquim/KRITA_REF 2>/dev/null || true)
          REF=${REF:-master}
          git clone --filter=blob:none https://github.com/KDE/krita.git krita
          cd krita
          git checkout "$REF"
          git config user.name "Nanquim CI"
          git config user.email "ci@nanquim.invalid"
          shopt -s nullglob
          for p in ../nanquim/patches/*.patch; do
            echo "## Aplicando $p"
            git am --3way "$p"
          done
          echo "KRITA_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Fontes Montserrat (SIL Open Font License)
        shell: bash
        run: |
          set -e
          FONTS=krita/krita/data/splash/fonts
          RES=krita/packaging/android/apk/res/font
          mkdir -p "$FONTS" "$RES"
          for w in Regular Medium SemiBold Bold; do
            ok=0
            for url in \
              "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-$w.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-$w.ttf"; do
              if curl -fsSL --retry 3 -o "$FONTS/Montserrat-$w.ttf" "$url"; then ok=1; break; fi
            done
            [ "$ok" = 1 ] || { echo "Não consegui baixar Montserrat-$w"; exit 1; }
          done
          curl -fsSL --retry 3 -o "$FONTS/OFL.txt" https://raw.githubusercontent.com/JulietaUla/Montserrat/master/OFL.txt || true
          cp "$FONTS/Montserrat-Regular.ttf" "$RES/montserrat_regular.ttf"
          cp "$FONTS/Montserrat-Bold.ttf" "$RES/montserrat_bold.ttf"
          ls -la "$FONTS" "$RES"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, build-tools e NDK
        shell: bash
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;${NDK_VERSION}" > /dev/null
          {
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_ROOT=$ANDROID_SDK_ROOT"
            echo "KDECI_ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "KDECI_ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: Ferramentas do sistema
        shell: bash
        run: |
          # As ferramentas de host do Qt (qmlimportscanner) vêm compiladas com GCC 13+.
          # Com o libstdc++ do GCC 12 do Ubuntu 22.04 elas travam (segfault no std::cout).
          # O add-apt-repository depende da API do Launchpad, que às vezes não responde.
          # Tenta 3 vezes; se não der, registra o PPA direto, com a chave pública dele.
          ok=0
          for n in 1 2 3; do
            if timeout 90 sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test > /dev/null 2>&1; then ok=1; break; fi
            echo "add-apt-repository falhou (tentativa $n)"; sleep 10
          done
          if [ "$ok" != 1 ]; then
            curl -fsSL --retry 5 "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F" \
              | sudo gpg --dearmor -o /usr/share/keyrings/toolchain-r.gpg
            echo "deb [signed-by=/usr/share/keyrings/toolchain-r.gpg] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu jammy main" \
              | sudo tee /etc/apt/sources.list.d/toolchain-r.list
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libstdc++6 ccache ninja-build gettext python3-venv patchelf > /dev/null
          strings /lib/x86_64-linux-gnu/libstdc++.so.6 | grep -E '^GLIBCXX_3\.4\.3[0-9]' | tail -1
          cmake --version | head -1; python3 --version; java -version 2>&1 | head -1

      - name: Restaurar cache de compilação
        uses: actions/cache/restore@v4
        with:
          path: /mnt/cache/ccache
          key: ccache-android-arm64-${{ github.run_id }}
          restore-keys: ccache-android-arm64-

      - name: Compilar o Krita (pode levar algumas horas na primeira vez)
        shell: bash
        working-directory: krita
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b master --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1

          python3 -m venv venv --upgrade-deps
          . venv/bin/activate
          pip install -q -r krita-deps-management/requirements.txt
          . venv/bin/activate
          unset VIRTUAL_ENV

          export KDECI_REPO_METADATA_PATH="$PWD/krita-deps-management/repo-metadata"
          export CMAKE_TOOLCHAIN_FILE="$PWD/krita-deps-management/tools/android-toolchain-krita.cmake"
          git config --global --add safe.directory "$PWD"

          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py \
            krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d master
          python3 -u krita-deps-management/tools/generate-deps-file.py \
            -s branch-corrected-deps.yml -o .kde-ci.yml
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py \
            --project krita --branch master \
            --platform "Android/${KDECI_ANDROID_ABI}/Qt5/Shared" \
            --only-build --skip-publishing 2>&1 | tee build-krita.log

      - name: Restaurar chave de assinatura do Nanquim
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/nanquim-key
          key: nanquim-signing-key-v1

      - name: Preparar chave de assinatura
        shell: bash
        env:
          KS_B64: ${{ secrets.NANQUIM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NANQUIM_KEYSTORE_PASS }}
        run: |
          mkdir -p ~/nanquim-key
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "## Usando a chave permanente dos segredos do repositório"
            echo "$KS_B64" | base64 -d > ~/nanquim-key/nanquim.jks
            printf '%s' "$KS_PASS" > ~/nanquim-key/pass
          elif [ ! -f ~/nanquim-key/nanquim.jks ]; then
            echo "## Criando uma chave nova (fica no cache privado do repositório)"
            python3 -c "import secrets;print(secrets.token_urlsafe(24), end='')" > ~/nanquim-key/pass
            keytool -genkeypair -keystore ~/nanquim-key/nanquim.jks -alias nanquim \
              -keyalg RSA -keysize 4096 -validity 11000 \
              -storepass "$(cat ~/nanquim-key/pass)" -keypass "$(cat ~/nanquim-key/pass)" \
              -dname "CN=Nanquim, O=Nanquim, C=BR" > /dev/null 2>&1
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          else
            echo "## Usando a chave do cache"
          fi
          keytool -list -keystore ~/nanquim-key/nanquim.jks -storepass "$(cat ~/nanquim-key/pass)" | grep -i "SHA-256\|SHA256" || true

      - name: Guardar chave nova no cache
        if: env.NEW_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/nanquim-key
          key: nanquim-signing-key-v1

      - name: Gerar o APK
        shell: bash
        working-directory: krita
        run: |
          . venv/bin/activate
          unset VIRTUAL_ENV
          export CI_COMMIT_SHORT_SHA="$KRITA_SHA"
          echo "## teste rápido do qmlimportscanner"
          /mnt/wd/krita/_install/bin/qmlimportscanner -importPath /mnt/wd/krita/_install/qml < /dev/null | head -c 300 || true
          echo
          python3 -u build-tools/ci-scripts/build-android-package.py 2>&1 | tee build-apk.log
          ls -la /mnt/wd/krita/_packaging
          UNSIGNED=$(ls /mnt/wd/krita/_packaging/*.apk | head -1)
          OUT="/mnt/wd/krita/_packaging/Nanquim-arm64-${KRITA_SHA}-build${{ github.run_number }}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks ~/nanquim-key/nanquim.jks --ks-key-alias nanquim \
            --ks-pass "pass:$(cat ~/nanquim-key/pass)" \
            --out "$OUT" "$UNSIGNED"
          rm -f "$UNSIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "$OUT" && ls -la /mnt/wd/krita/_packaging

      - name: Diagnóstico do qmlimportscanner
        if: failure()
        shell: bash
        working-directory: krita
        run: |
          set +e
          B=/mnt/wd/krita/_build
          S=/mnt/wd/krita/_install/bin/qmlimportscanner
          J=$(ls "$B"/*deployment*.json 2>/dev/null | head -1)
          echo "## json: $J"
          python3 - "$J" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("## chaves:", sorted(d.keys()))
          for k, v in d.items():
              if "qml" in k or k in ("qt", "sdk", "ndk", "stdcpp-path", "extraPrefixDirs"):
                  print("##", k, "=", v)
          PYEOF
          echo "## binário"; file "$S"; ldd "$S" | head -40
          ARGS=$(python3 - "$J" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          roots = d.get("qml-root-path", [])
          roots = [roots] if isinstance(roots, str) else roots
          imps = d.get("qml-import-paths", "")
          imps = imps.split(",") if isinstance(imps, str) else imps
          a = []
          for r in roots:
              a += ["-rootPath", r]
          for i in imps + ["/mnt/wd/krita/_install/qml"]:
              if i:
                  a += ["-importPath", i]
          print(" ".join(a))
          PYEOF
          )
          echo "## args: $ARGS"
          timeout 600 "$S" $ARGS > /tmp/scan.json 2> /tmp/scan.err; echo "## exit=$?"
          head -c 1500 /tmp/scan.json; echo; tail -40 /tmp/scan.err
          sudo apt-get install -y -qq gdb > /dev/null 2>&1
          timeout 900 gdb -batch -ex run -ex bt -ex "info sharedlibrary" --args "$S" $ARGS 2>&1 | tail -90

      - name: Salvar cache de compilação (mesmo se falhar)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/cache/ccache
          key: ccache-android-arm64-${{ github.run_id }}

      - name: Espaço usado
        if: always()
        shell: bash
        run: df -h / ; CCACHE_DIR=/mnt/cache/ccache ccache -s 2>/dev/null | head -20 || true; du -sh /mnt/cache/ccache || true

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            krita/*.log
          if-no-files-found: ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: nanquim-arm64-v8a
          path: /mnt/wd/krita/_packaging/*.apk

      - name: Publicar APK numa Release (link direto para baixar no tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nanquim build ${{ github.run_number }} (Krita ${{ env.KRITA_SHA }})
          prerelease: true
          body: |
            APK otimizado para Android arm64 (Galaxy Tab S10 Lite), assinado com a chave do Nanquim.
            Baseado no Krita ${{ env.KRITA_SHA }} + patches do Nanquim (pasta patches/).
            Instala lado a lado com o Krita oficial (pacote org.krita.next).
          files: /mnt/wd/krita/_packaging/*.apk
